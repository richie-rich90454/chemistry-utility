services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "6005:6005"
    environment:
      - DB_DRIVER=sqlite3
      - DB_DSN=/data/chemistry.db
      - JWT_SECRET=dev-secret-key
    volumes:
      - .:/app
      - go-modules:/go/pkg/mod
      - dev-data:/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    restart: unless-stopped

volumes:
  go-modules:
  dev-data:
