openapi: 3.1.0
info:
  title: Chemistry Utility API
  version: 1.0.0
  description: |
    REST API for the Chemistry Utility application.

    Provides chemistry calculators (molar mass, equation balancing, stoichiometry,
    gas laws, thermodynamics, kinetics, electrochemistry, quantum, solutions),
    compound search, and plugin administration.

    ## Errors
    All error responses use RFC 7807 Problem Details (`application/problem+json`).

    ## Anonymous web build
    The anonymous web build ships without a database: DB-backed endpoints
    (compound search, compound detail, plugins) return `501 Not Implemented`
    there. `GET /compounds/lookup` is the stateless exception — it proxies
    PubChem PUG-REST per request, retains nothing, and stays available.

    ## Validation (400)
    Malformed requests return `400` with an RFC 7807 body. Common cases:
    missing required query or body fields, unknown calculator types or
    compound search types, invalid UUID path parameters, and out-of-range
    paging values.
  contact:
    name: Chemistry Utility
    url: https://chemistry-utility.dev
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
  - url: http://localhost:6005/api/v1
    description: Local development server
  - url: https://api.chemistry-utility.dev/api/v1
    description: Production server
tags:
  - name: Calculators
    description: List and run chemistry calculators
  - name: Compounds
    description: Chemical compound lookup and search
  - name: Plugins
    description: Plugin management
  - name: Docs
    description: Interactive API documentation
paths:
  /calculators:
    get:
      tags: [Calculators]
      summary: List available calculator types
      description: Returns the sorted list of all registered calculator type identifiers.
      responses:
        '200':
          description: List of calculator types
          content:
            application/json:
              schema:
                type: object
                properties:
                  calculators:
                    type: array
                    items:
                      type: string
                    example: [arrhenius, bond-type, buffer-solution, cell-potential]
                required: [calculators]
        '429':
          $ref: '#/components/responses/RateLimitError'
  /calculators/{type}:
    post:
      tags: [Calculators]
      summary: Run a calculator
      description: |
        Executes the calculator identified by `type` with the provided input map.
        The shape of `inputs` depends on the calculator type; see the developer
        guide for per-calculator input schemas. Returns a `CalculationResult`.
      parameters:
        - $ref: '#/components/parameters/CalculatorType'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Calculator-specific input map. See developer guide for details.
              additionalProperties: true
            example:
              formula: H2O
      responses:
        '200':
          description: Calculator result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalculationResult'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '429':
          $ref: '#/components/responses/RateLimitError'
        '500':
          $ref: '#/components/responses/InternalError'
  /compounds:
    get:
      tags: [Compounds]
      summary: Search compounds
      description: Searches compounds by name, formula, or other indexed fields.
      parameters:
        - name: q
          in: query
          required: true
          description: Search query string
          schema:
            type: string
            minLength: 1
        - $ref: '#/components/parameters/LimitQuery'
        - $ref: '#/components/parameters/OffsetQuery'
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                type: object
                properties:
                  compounds:
                    type: array
                    items:
                      $ref: '#/components/schemas/Compound'
                  query:
                    type: string
                required: [compounds, query]
        '400':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimitError'
        '500':
          $ref: '#/components/responses/InternalError'
  /compounds/{id}:
    get:
      tags: [Compounds]
      summary: Get a compound by ID
      parameters:
        - $ref: '#/components/parameters/CompoundIdPath'
      responses:
        '200':
          description: The compound
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Compound'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '429':
          $ref: '#/components/responses/RateLimitError'
        '500':
          $ref: '#/components/responses/InternalError'
  /compounds/lookup:
    get:
      tags: [Compounds]
      summary: Stateless compound lookup via PubChem
      description: |
        Searches PubChem PUG-REST by name, formula, CAS number, or SMILES and
        returns compounds in the same envelope as `GET /compounds`.

        Anonymity property: this endpoint is fully stateless. It performs no
        database reads or writes and retains nothing — results are fetched
        upstream per request and never stored. It is the only compound
        endpoint available on the anonymous web build (no database); the
        DB-backed `GET /compounds` and `GET /compounds/{id}` return `501`
        there. Lookup compound IDs have the form `pubchem:<CID>` and cannot
        be used with `GET /compounds/{id}`, which expects UUIDs.
      parameters:
        - name: q
          in: query
          required: true
          description: Search query string
          schema:
            type: string
            minLength: 1
        - name: type
          in: query
          required: false
          description: Search field (defaults to name)
          schema:
            type: string
            enum: [name, formula, cas, smiles]
            default: name
        - name: limit
          in: query
          required: false
          description: Maximum results (1-10, defaults to 10)
          schema:
            type: integer
            minimum: 1
            maximum: 10
            default: 10
      responses:
        '200':
          description: Lookup results (same envelope as compound search)
          content:
            application/json:
              schema:
                type: object
                properties:
                  compounds:
                    type: array
                    items:
                      $ref: '#/components/schemas/Compound'
                  query:
                    type: string
                required: [compounds, query]
        '400':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimitError'
        '500':
          $ref: '#/components/responses/InternalError'
  /plugins:
    get:
      tags: [Plugins]
      summary: List all plugins
      description: Returns all registered plugins.
      responses:
        '200':
          description: List of plugins
          content:
            application/json:
              schema:
                type: object
                properties:
                  plugins:
                    type: array
                    items:
                      $ref: '#/components/schemas/Plugin'
                required: [plugins]
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Plugins]
      summary: Create a plugin
      description: Registers a new plugin (created in disabled state).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePluginRequest'
      responses:
        '201':
          description: Plugin created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plugin'
        '400':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /plugins/{id}/enable:
    patch:
      tags: [Plugins]
      summary: Enable a plugin
      description: Enables the plugin with the given ID.
      parameters:
        - $ref: '#/components/parameters/PluginIdPath'
      responses:
        '200':
          description: Plugin enabled
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled:
                    type: boolean
                    example: true
                required: [enabled]
        '400':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /plugins/{id}/disable:
    patch:
      tags: [Plugins]
      summary: Disable a plugin
      description: Disables the plugin with the given ID.
      parameters:
        - $ref: '#/components/parameters/PluginIdPath'
      responses:
        '200':
          description: Plugin disabled
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled:
                    type: boolean
                    example: false
                required: [enabled]
        '400':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /plugins/{id}:
    delete:
      tags: [Plugins]
      summary: Delete a plugin
      description: Permanently deletes a plugin by ID.
      parameters:
        - $ref: '#/components/parameters/PluginIdPath'
      responses:
        '204':
          description: Plugin deleted successfully
        '400':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  parameters:
    CalculatorType:
      name: type
      in: path
      required: true
      description: Calculator type identifier (e.g. `molar-mass`, `equation-balance`).
      schema:
        type: string
      example: molar-mass
    CompoundIdPath:
      name: id
      in: path
      required: true
      description: UUID of the compound
      schema:
        type: string
        format: uuid
    PluginIdPath:
      name: id
      in: path
      required: true
      description: UUID of the plugin
      schema:
        type: string
        format: uuid
    LimitQuery:
      name: limit
      in: query
      required: false
      description: Number of items per page (1-100, defaults to 20)
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    OffsetQuery:
      name: offset
      in: query
      required: false
      description: Number of items to skip (defaults to 0)
      schema:
        type: integer
        minimum: 0
        default: 0
  responses:
    ValidationError:
      description: The request was malformed or failed validation (RFC 7807).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFoundError:
      description: The requested resource was not found (RFC 7807).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    RateLimitError:
      description: Rate limit exceeded (RFC 7807).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InternalError:
      description: Unexpected server error (RFC 7807).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Problem:
      type: object
      description: RFC 7807 Problem Details object.
      properties:
        type:
          type: string
          format: uri
          description: URI identifying the problem type.
          example: https://chemistry-utility.dev/errors/400
        title:
          type: string
          description: Short human-readable summary of the problem.
          example: Bad Request
        status:
          type: integer
          description: HTTP status code.
          example: 400
        detail:
          type: string
          description: Human-readable explanation specific to this occurrence.
          example: "missing required field: email"
        instance:
          type: string
          description: Request path that produced the problem.
          example: /api/v1/calculators
      required: [type, title, status, detail, instance]
    CreatePluginRequest:
      type: object
      properties:
        name:
          type: string
          example: crystal-structure
        version:
          type: string
          example: 1.0.0
        author:
          type: string
          example: Chemistry Utility Team
        manifest:
          type: string
          description: Plugin manifest JSON or YAML (optional)
      required: [name, version, author]
    CalculationResult:
      type: object
      description: |
        Result returned by a calculator. Reflects the serialized form of
        `calculators.CalculationResult`.
      properties:
        Value:
          type: number
          description: Primary calculated value.
          example: 18.015
        Unit:
          type: string
          example: g/mol
        Breakdown:
          type: array
          items:
            type: object
            properties:
              Label:
                type: string
              Value:
                type: number
              Unit:
                type: string
        Steps:
          type: array
          items:
            type: string
        Metadata:
          type: object
          additionalProperties: true
      required: [Value, Unit]
    Compound:
      type: object
      description: |
        A chemical compound record. Field names reflect the serialized form
        of `db.Compound` (PascalCase JSON keys).
      properties:
        ID:
          type: string
          format: uuid
        Name:
          type: string
          example: Water
        Formula:
          type: string
          example: H2O
        CASNumber:
          type: string
          example: 7732-18-5
        SMILES:
          type: string
          example: O
        InChI:
          type: string
        MolarMass:
          type: number
          example: 18.015
        Properties:
          type: string
          description: JSON-encoded additional properties.
        Source:
          type: string
          description: Data source (e.g. PubChem, manual).
        CreatedAt:
          type: string
          format: date-time
        UpdatedAt:
          type: string
          format: date-time
      required: [ID, Name, Formula, MolarMass, CreatedAt, UpdatedAt]
    Plugin:
      type: object
      description: |
        A plugin record. Field names reflect the serialized form of
        `db.Plugin` (PascalCase JSON keys).
      properties:
        ID:
          type: string
          format: uuid
        Name:
          type: string
          example: crystal-structure
        Version:
          type: string
          example: 1.0.0
        Author:
          type: string
        Manifest:
          type: string
          description: Plugin manifest content (JSON or YAML).
        Enabled:
          type: boolean
        CreatedAt:
          type: string
          format: date-time
      required: [ID, Name, Version, Author, Enabled, CreatedAt]
