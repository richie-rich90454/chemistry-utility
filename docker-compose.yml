services:
  app:
    build: .
    ports:
      - "6005:6005"
    environment:
      - DB_DRIVER=postgres
      - DB_DSN=postgresql://chemutil:chemutil@postgres:5432/chemutil?sslmode=disable
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - REDIS_URL=redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - app-data:/data
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: chemutil
      POSTGRES_PASSWORD: chemutil
      POSTGRES_DB: chemutil
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chemutil"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  app-data:
  pg-data:
