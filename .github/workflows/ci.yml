name: CI/CD

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  website:
    name: Website Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build web bundle (for Go embed)
        run: npm run build:web

      - name: Run tests with coverage
        run: npx vitest run --coverage

      - name: Upload web dist
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist
          retention-days: 1

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: website-coverage
          path: coverage
          retention-days: 7
          if-no-files-found: warn

  core:
    name: Core Wrapper Build & Test
    runs-on: ubuntu-latest
    needs: [website]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go 1.26
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: core/go.sum

      - name: Install Linux dependencies (CGO + WebKit for Wails)
        run: sudo apt-get update && sudo apt-get install -y gcc libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Download web dist (for embed)
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist

      - name: Stage web dist for the embed
        run: node scripts/stage-dist.mjs

      - name: Build
        run: cd core && go build ./...

      - name: Run tests with coverage
        run: cd core && go test ./internal/... -coverprofile=coverage.out

      - name: Print coverage summary
        run: cd core && go tool cover -func=coverage.out

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: core-coverage
          path: core/coverage.out
          retention-days: 7
          if-no-files-found: warn

  lint:
    name: Lint & Audit
    runs-on: ubuntu-latest
    needs: [website]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go 1.26
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: core/go.sum

      - name: Install Linux dependencies (CGO + WebKit for Wails)
        run: sudo apt-get update && sudo apt-get install -y gcc libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Download web dist (for embed)
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist

      - name: Stage web dist for the embed
        run: node scripts/stage-dist.mjs

      # Build from source with the current toolchain: prebuilt golangci-lint
      # binaries are built with Go 1.24 and refuse to load go.mod "go 1.25.0".
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8

      - name: Run golangci-lint
        run: cd core && golangci-lint run ./...

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install website dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit
        continue-on-error: true

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [website]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go 1.26
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
          cache: true
          cache-dependency-path: core/go.sum

      - name: Install Linux dependencies (CGO + WebKit for Wails)
        run: sudo apt-get update && sudo apt-get install -y gcc libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Download web dist (for embed)
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist

      - name: Stage web dist for the embed
        run: node scripts/stage-dist.mjs

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: cd core && govulncheck ./...

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install website dependencies
        run: npm ci

      - name: Run npm audit (high severity)
        run: npm audit --audit-level=high
