name: CI/CD

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  website:
    name: Website Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint (ESLint)
        run: npm run lint

      - name: Build web bundle (for Go embed)
        run: npm run build:web

      - name: Verify web bundle
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/index.html
          echo "Web bundle verified."

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload web dist
        uses: actions/upload-artifact@v6
        with:
          name: web-dist
          path: dist/
          retention-days: 1
          if-no-files-found: error

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v6
        with:
          name: website-coverage
          path: coverage/
          retention-days: 7
          if-no-files-found: warn

  core:
    name: Core Wrapper Build & Test
    runs-on: ubuntu-latest
    needs: [website]
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Go 1.26 (latest patch)
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          check-latest: true
          cache: true
          cache-dependency-path: core/go.sum

      - name: Verify Go toolchain
        run: |
          go version
          go env GOVERSION

      - name: Install Linux dependencies (CGO + WebKit for Wails)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev

      - name: Download web dist
        uses: actions/download-artifact@v7
        with:
          name: web-dist
          path: dist

      - name: Stage web dist for embed
        run: node scripts/stage-dist.mjs

      - name: Build Go core
        working-directory: core
        run: go build ./...

      - name: Vet Go core
        working-directory: core
        run: go vet ./...

      - name: Run Go tests with coverage
        working-directory: core
        run: |
          go test ./... \
            -coverprofile=coverage.out

      - name: Print coverage summary
        working-directory: core
        run: go tool cover -func=coverage.out

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v6
        with:
          name: core-coverage
          path: core/coverage.out
          retention-days: 7
          if-no-files-found: warn

  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    needs: [website]
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Go 1.26 (latest patch)
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          check-latest: true
          cache: true
          cache-dependency-path: core/go.sum

      - name: Verify Go toolchain
        run: |
          go version
          go env GOVERSION

      - name: Install Linux dependencies (CGO + WebKit for Wails)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev

      - name: Download web dist
        uses: actions/download-artifact@v7
        with:
          name: web-dist
          path: dist

      - name: Stage web dist for embed
        run: node scripts/stage-dist.mjs

      # Prebuilt golangci-lint binaries are built with the current Go release
      # and load core/go.mod without a source build. The action installs the
      # binary once and puts it on PATH for the lint and format steps below.
      - name: Install golangci-lint v2
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          install-only: true

      - name: Run golangci-lint
        working-directory: core
        shell: bash
        run: |
          set -euo pipefail
          golangci-lint run --config=.golangci.yml --timeout=5m ./...

      - name: Verify Go formatting
        working-directory: core
        shell: bash
        run: |
          set -euo pipefail

          # `fmt --diff` prints (but does not apply) the gofmt/goimports diff.
          # Any output means a tracked file needs formatting, so fail on it.
          diff_output="$(golangci-lint fmt --config=.golangci.yml --diff)"

          if [ -n "$diff_output" ]; then
            echo "::error::Go files are not formatted (gofmt/goimports)."
            printf '%s\n' "$diff_output"
            exit 1
          fi

          echo "Go formatting OK."

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [website]
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Go 1.26 (latest patch)
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          check-latest: true
          cache: true
          cache-dependency-path: core/go.sum

      - name: Verify Go toolchain
        shell: bash
        run: |
          set -euo pipefail

          go version
          go env GOVERSION

      - name: Install Linux dependencies (CGO + WebKit for Wails)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev

      - name: Download web dist
        uses: actions/download-artifact@v7
        with:
          name: web-dist
          path: dist

      - name: Stage web dist for embed
        run: node scripts/stage-dist.mjs

      - name: Install govulncheck
        run: |
          go install \
            golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        working-directory: core
        shell: bash
        run: |
          set -euo pipefail
          govulncheck ./...

      - name: Setup Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install website dependencies
        run: npm ci

      - name: Run npm audit (high severity)
        run: npm audit --audit-level=high
