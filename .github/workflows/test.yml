name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    name: Conformance Vectors
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify conformance vectors are unchanged
        run: npm run conformance:verify

  test:
    name: Website, E2E & Desktop
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          check-latest: true
          cache-dependency-path: core/go.sum

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev

      - name: Install dependencies
        run: npm ci

      - name: Run website tests
        run: npm test

      - name: Install Playwright browser (Chrome channel)
        run: npx playwright install --with-deps chrome

      - name: Run Playwright E2E tests
        run: npx playwright test

      - name: Build web bundle
        run: npm run build:web

      - name: Stage web dist for the desktop embed
        run: npm run desktop:stage

      - name: Run Go tests
        working-directory: core
        run: go test ./...

      - name: Detect Wails version
        id: wails
        working-directory: core
        run: |
          set -euo pipefail
          echo "version=$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v2)" >> "$GITHUB_OUTPUT"

      - name: Install matching Wails CLI
        env:
          WAILS_VERSION: ${{ steps.wails.outputs.version }}
        run: |
          set -euo pipefail
          go install "github.com/wailsapp/wails/v2/cmd/wails@${WAILS_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build the desktop app
        run: npm run wails:build
