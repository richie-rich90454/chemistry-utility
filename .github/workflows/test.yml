name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install frontend dependencies
        run: cd frontend && npm install
      - name: Verify conformance vectors are unchanged
        run: npm run conformance:verify

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Install frontend dependencies
        run: cd frontend && npm install
      - name: Run frontend tests
        run: cd frontend && npm test
      - name: Run Playwright E2E tests (system Chrome)
        run: cd frontend && npx playwright test
      - name: Build frontend
        run: cd frontend && npm run build
      - name: Stage frontend for desktop embed
        run: npm run stage:desktop
      - name: Run Go tests
        run: cd core && go test ./...
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest
      - name: Build application
        run: cd core && wails build -tags webkit2_41
