name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Verify conformance vectors are unchanged
        run: npm run conformance:verify

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: core/go.sum
      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Install dependencies
        run: npm install
      - name: Run website tests
        run: npm test
      - name: Run Playwright E2E tests (system Chrome)
        run: npx playwright test
      - name: Build web bundle
        run: npm run build:web
      - name: Stage web dist for the desktop embed
        run: npm run desktop:stage
      - name: Run Go tests
        run: cd core && go test ./...
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest
      - name: Build application
        run: cd core && wails build -tags webkit2_41
