name: Frontend Timing Budget

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  timing-budget:
    name: Parser/Balancer Timing Budgets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Type check
        run: cd frontend && npx tsc --noEmit

      - name: Run parser/balancer timing budgets
        run: cd frontend && npx vitest run src/modules/parserTiming.test.ts

      - name: Lint owned modules
        run: >
          cd frontend &&
          npx eslint src/modules/exportManager.ts src/modules/exportPrintView.ts
          src/modules/structureSketch.ts src/modules/molecularViewer.ts
          src/solid/routes/molecular-viewer.tsx
