name: Frontend Timing Budget

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: frontend-budget-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  timing-budget:
    name: Parser/Balancer Timing Budgets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Run parser/balancer timing budgets
        run: npx vitest run src/modules/parserTiming.test.ts

      - name: Lint owned modules
        run: >
          npx eslint src/modules/exportManager.ts src/modules/exportPrintView.ts
          src/modules/structureSketch.ts src/modules/molecularViewer.ts
          src/solid/routes/molecular-viewer.tsx
